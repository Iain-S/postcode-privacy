[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "postcode-privacy"
# The git tag is the single source of truth, so a release cannot publish a
# version that disagrees with what was tagged.
dynamic = ["version"]
description = "Differential privacy for UK postcodes, measured in graph hops rather than metres"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iain Stenson", email = "istenson@turing.ac.uk" }]
keywords = ["differential-privacy", "postcodes", "geoprivacy", "uk", "anonymisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# No "License ::" classifier: PEP 639's license/license-files supersede it and
# modern build tooling rejects the two together.
# click is the only CLI dependency and pulls nothing transitively. The
# command is part of the documented interface, so it is not behind an extra.
# pyproj is required, not optional: ONSPD supplies Northern Ireland grid
# references in the Irish Grid, and reading them as British National Grid
# silently places Belfast in Derbyshire. See AGENTS.md.
dependencies = ["numpy>=1.26", "scipy>=1.11", "click>=8.1", "pyproj>=3.6"]

[project.optional-dependencies]
frames = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
postcode-privacy = "postcode_privacy.cli:main"

[project.urls]
Homepage = "https://iain-s.github.io/postcode-privacy/"
Documentation = "https://iain-s.github.io/postcode-privacy/"
Repository = "https://github.com/Iain-S/postcode-privacy"
Issues = "https://github.com/Iain-S/postcode-privacy/issues"
Changelog = "https://github.com/Iain-S/postcode-privacy/blob/main/CHANGELOG.md"

[dependency-groups]
# Figure generation. Separate from docs because the figures are produced by
# hand from data that cannot be committed, and the site builds from the
# committed outputs without needing these.
figures = [
    "matplotlib>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "ty>=0.0.1a1",
    "pytest-benchmark>=4.0",
    "pre-commit>=3.7",
    # The [frames] extra is optional for users but must be tested here.
    "pandas>=2.0",
    "pyarrow>=14",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/postcode_privacy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/postcode_privacy"]

# The source distribution carries what is needed to build and test, and nothing
# else. Committed figures alone were two megabytes of a 2.1 MB sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/AGENTS.md",
]

# The library must never ship postcode data: ONSPD Northern Ireland postcodes
# are not redistributable. CI asserts the built wheel contains no such files.
[tool.hatch.build.targets.wheel.force-include]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: takes more than a second (deselect with -m 'not slow')",
    "statistical: seeded statistical test; must never be flaky",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "PT",          # pytest style
    "SIM",         # simplify
    "RET",         # returns
    "ARG",         # unused arguments
    "PTH",         # use pathlib
    "NPY",         # numpy legacy random etc.
    "RUF",
    "S",           # bandit: this is a privacy library, take security lints seriously
]
ignore = [
    "E741",        # ambiguous names: we legitimately use single letters for maths
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
