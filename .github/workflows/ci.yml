name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    # The OS axis is not redundant. We promise a subject's perturbed postcode never
    # changes; proving that across platforms is exactly what the golden determinism
    # tests are for, so they must actually run on more than one platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest

  no-data-in-wheel:
    # The package must ship no postcode data: ONSPD Northern Ireland postcodes are
    # not redistributable. Fail loudly rather than discovering this on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Assert no postcode data or graph artefacts are packaged
        run: |
          set -euo pipefail
          contents=$(python -c "
          import pathlib, zipfile
          w = next(pathlib.Path('dist').glob('*.whl'))
          print('\n'.join(zipfile.ZipFile(w).namelist()))
          ")
          echo "$contents"
          if echo "$contents" | grep -Ei '\.(ppg|csv|zip|parquet)$'; then
            echo "::error::Wheel contains data files; it must ship code only."
            exit 1
          fi

  benchmark:
    # Reports, never gates. The real numbers cannot be produced here: ONSPD
    # cannot be committed and is a gigabyte besides, so this runs the
    # measurement code over a synthetic graph purely to catch it breaking. The
    # figures quoted in the documentation come from a local run against the
    # real artefact, recorded with the graph hash that produced them.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Measurement code runs end to end
        run: uv run pytest tests/test_utility.py tests/test_attack.py -v
      - name: Throughput at scale
        run: uv run pytest tests/test_scale.py -v
