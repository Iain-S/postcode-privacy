name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    # The OS axis is not redundant. We promise a subject's perturbed postcode never
    # changes; proving that across platforms is exactly what the golden determinism
    # tests are for, so they must actually run on more than one platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest

  no-data-in-artefacts:
    # The package must ship no postcode data: ONSPD Northern Ireland postcodes
    # are not redistributable. Fail loudly rather than discovering it on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Assert no postcode data in the wheel OR the sdist
        # The sdist matters as much as the wheel and includes far more by
        # default, so both are checked.
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, tarfile, zipfile

          suspect = (".csv", ".ppg", ".zip", ".parquet", ".xlsx", ".asc")
          bad = []
          for wheel in pathlib.Path("dist").glob("*.whl"):
              bad += [f"{wheel.name}:{n}" for n in zipfile.ZipFile(wheel).namelist()
                      if n.lower().endswith(suspect)]
          for sdist in pathlib.Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist) as archive:
                  bad += [f"{sdist.name}:{n}" for n in archive.getnames()
                          if n.lower().endswith(suspect)]
          if bad:
              print("data files present:", *bad, sep="\n  ")
              sys.exit(1)
          print("clean: no data files in any artefact")
          PY

  benchmark:
    # Reports, never gates. The real numbers cannot be produced here: ONSPD
    # cannot be committed and is a gigabyte besides, so this runs the
    # measurement code over a synthetic graph purely to catch it breaking. The
    # figures quoted in the documentation come from a local run against the
    # real artefact, recorded with the graph hash that produced them.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Measurement code runs end to end
        run: uv run pytest tests/test_utility.py tests/test_attack.py -v
      - name: Throughput at scale
        run: uv run pytest tests/test_scale.py -v
