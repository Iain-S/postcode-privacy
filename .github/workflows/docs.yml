name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly rather than to a floating major: astral-sh publishes
      # no major tag beyond v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --strict turns broken internal links and bad references into failures,
      # so documentation rot shows up in CI rather than on the published site.
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
