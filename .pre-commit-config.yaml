repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Postcode data must never enter the repository — NI postcodes are not
      # redistributable and the artefacts are large.
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
  - repo: local
    hooks:
      # Belt and braces for the licensing risk: .gitignore can be bypassed with
      # `git add -f`, a pre-commit hook cannot be bypassed by accident.
      - id: no-postcode-data
        name: refuse to commit postcode source data or graph artefacts
        entry: >-
          bash -c 'for f in "$@"; do case "$(basename "$f")" in
          ONSPD*|NSPL*|*.ppg) echo "REFUSING: $f is postcode source data or a
          graph artefact. ONSPD Northern Ireland records are not
          redistributable."; exit 1;; esac; done' --
        language: system
        pass_filenames: true
